# rci-gateway — serves the built SPA and reverse-proxies the Django API.
# Upstream "rci-api" is resolved through Docker's embedded DNS at request
# time, so the API can restart without nginx holding a stale IP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $rci_api http://rci-api:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # cloudflared supplies X-Forwarded-Proto: https to this container.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass $rci_api;
    }

    # Django admin (optional, same origin).
    location /admin/ {
        proxy_pass $rci_api;
    }

    # Admin/DRF static files served by whitenoise inside rci-api.
    location /static/ {
        proxy_pass $rci_api;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
